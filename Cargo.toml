[workspace]
resolver = "2"
members = [
    "crates/wakaclock-core",
    "crates/wakaclock-ast",
    "crates/wakaclock-cli",
    "crates/wakaclock-ls",
    "backend/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pattanun-np/wakaclock"

[workspace.dependencies]
# Shared across crates — pin versions here, reference in member Cargo.toml
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
dotenvy = "0.15"
clap = { version = "4.5", features = ["derive"] }

# Server
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }
clickhouse = { version = "0.13", features = ["lz4", "uuid", "chrono"] }
governor = "0.8"

# Core
rusqlite = { version = "0.29", features = ["bundled"] }
gix = { version = "0.68", default-features = false, features = ["worktree-mutation"] }
regex = "1"

# AST
tree-sitter = "0.24"

# LSP
tower-lsp = "0.20"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = "0.2"

#cli
toml = "0.8"
dirs = "5.0"
