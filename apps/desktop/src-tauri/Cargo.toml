[package]
name = "atoaxis-desktop"
version = "0.1.0"
edition = "2021"
description = "AtoAxis native desktop activity tracker"

# This is a separate workspace; test inherits the smaller development artifacts.
# See ../../../.context/storage.md.
[profile.dev]
debug = 1
incremental = false

[lib]
name = "atoaxis_desktop"
path = "src/lib.rs"

[[bin]]
name = "atoaxis-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["time", "rt"] }
toml = "0.8"
wakaclock-core = { path = "../../../backend/api/crates/wakaclock-core" }

[dev-dependencies]
# `macros` + a multi-thread-free runtime for the sampling tests, which drive the
# 5s cadence with Tokio's paused clock instead of real time.
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"
objc2-app-kit = { version = "0.3.2", features = ["NSRunningApplication", "NSWorkspace", "libc"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }
