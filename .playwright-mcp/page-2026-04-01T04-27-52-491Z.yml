        - code [ref=e331]: "import requests from urllib.parse import parse_qsl refresh_token = dict(parse_qsl(session.access_token_response.text))['refresh_token'] data = { 'grant_type': 'refresh_token', 'client_id': client_id, 'client_secret': client_secret, 'refresh_token': refresh_token, } resp = requests.post('https://wakatime.com/oauth/token', data=data, timeout=5) print(resp.text) # Or, using the rauth library: # session = service.get_auth_session(data=data)"
