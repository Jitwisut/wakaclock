      - generic [ref=e105]:
        - heading "Introduction" [level=1] [ref=e106]
        - paragraph [ref=e107]:
          - text: The WakaTime API follows common
          - link "REST" [ref=e108] [cursor=pointer]:
            - /url: https://en.wikipedia.org/wiki/Representational_state_transfer
            - text: REST
            - generic [ref=e109]: 
          - text: conventions. This means you should use GET requests to retrieve data and POST, PUT, or PATCH requests to modify data. All API requests must be done over HTTPS.
        - paragraph [ref=e110]:
          - text: Every response will be a JSON object, which is a key-value hash. Data for a resource will be returned in the key named
          - code [ref=e111]: data
          - text: . Errors will be returned in the key named
          - code [ref=e112]: errors
          - text: or
          - code [ref=e113]: error
          - text: .
        - paragraph [ref=e114]: "HTTP response codes indicate the status of your request:"
        - list [ref=e115]:
          - listitem [ref=e116]:
            - link "200 - Ok" [ref=e117] [cursor=pointer]:
              - /url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/200
            - text: ": The request has succeeded."
          - listitem [ref=e118]:
            - link "201 - Created" [ref=e119] [cursor=pointer]:
              - /url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/201
            - text: ": The request has been fulfilled and resulted in a new resource being created."
          - listitem [ref=e120]:
            - link "202 - Accepted" [ref=e121] [cursor=pointer]:
              - /url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/202
            - text: ": The request has been accepted for processing, but the processing has not been completed. The"
            - link "stats resource" [ref=e122] [cursor=pointer]:
              - /url: "#stats"
            - text: may return this code.
          - listitem [ref=e123]:
            - link "302 - Redirect" [ref=e124] [cursor=pointer]:
              - /url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/302
            - text: ": Sometimes we return 302 instead of 429, resulting in a request timeout. If that’s the case, try spreading out the number of requests you’re making over a few minutes instead of all at once."
          - listitem [ref=e125]:
            - link "400 - Bad Request" [ref=e126] [cursor=pointer]:
              - /url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/400
            - text: ": The request is invalid. Check error message and try again."
          - listitem [ref=e127]:
            - link "401 - Unauthorized" [ref=e128] [cursor=pointer]:
              - /url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401
            - text: ": The request requires authentication, or your authentication was invalid."
          - listitem [ref=e129]:
            - link "403 - Forbidden" [ref=e130] [cursor=pointer]:
              - /url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/403
            - text: ": You are authenticated, but do not have permission to access the resource."
          - listitem [ref=e131]:
            - link "404 - Not Found" [ref=e132] [cursor=pointer]:
              - /url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/404
            - text: ": The resource does not exist."
          - listitem [ref=e133]:
            - link "429 - Too Many Requests" [ref=e134] [cursor=pointer]:
              - /url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/429
            - text: ": You are being rate limited, try making fewer than 10 requests per second on average over any 5 minute period."
          - listitem [ref=e135]:
            - link "500 - Server Error" [ref=e136] [cursor=pointer]:
              - /url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/500
            - text: ": Service unavailable, try again later."
        - paragraph [ref=e137]:
          - text: All API resources have the url prefix
          - code [ref=e138]: https://api.wakatime.com/api/v1/
          - text: .
        - paragraph [ref=e139]:
          - text: When using the WakaTime trademark or logo in your application, please follow our
          - link "usage guidelines" [ref=e140] [cursor=pointer]:
            - /url: /logos-and-usage
          - text: .
        - heading "Security" [level=4] [ref=e141]
        - paragraph [ref=e142]:
          - text: Do
          - strong [ref=e143]: NOT
          - text: use the API with your secret key on a public website. Instead, create an
          - link "embeddable chart" [ref=e144] [cursor=pointer]:
            - /url: /share
          - text: "that's safe to share publicly. Choose the JSON format to securely access your coding activity with JavaScript:"
        - paragraph [ref=e145]:
          - link "Embeddable SVG Charts and JSON" [ref=e146] [cursor=pointer]:
            - /url: /share
      - generic [ref=e147]:
        - heading "Authentication" [level=1] [ref=e148]
        - paragraph
        - heading "OAuth 2.0 Endpoints" [level=4] [ref=e149]
        - paragraph
        - paragraph [ref=e150]:
          - link "Create an app" [ref=e151] [cursor=pointer]:
            - /url: /apps
          - text: to get an OAuth 2.0 client token.
        - paragraph [ref=e152]: "The OAuth 2.0 provider endpoints are:"
        - list [ref=e153]:
          - listitem [ref=e154]:
            - code [ref=e155]: https://wakatime.com/oauth/authorize
            - text: "- Redirect your users here to request permission to access their account. Required url arguments are"
            - code [ref=e156]: client_id
            - text: ","
            - code [ref=e157]: response_type
            - text: of
            - code [ref=e158]: code
            - text: or
            - code [ref=e159]: token
            - text: ","
            - code [ref=e160]: redirect_uri
            - text: . Optional parameters are
            - code [ref=e161]: scope
            - text: ","
            - code [ref=e162]: state
            - text: ","
            - code [ref=e163]: force_approve
            - text: .
          - listitem [ref=e164]:
            - code [ref=e165]: https://wakatime.com/oauth/token
            - text: "- Make a server-side POST request here to get the secret access token. Required data is"
            - code [ref=e166]: client_id
            - text: ","
            - code [ref=e167]: client_secret
            - text: ","
            - code [ref=e168]: redirect_uri
            - text: must be the same url used in authorize step,
            - code [ref=e169]: grant_type
            - text: of
            - code [ref=e170]: authorization_code
            - text: ", and the"
            - code [ref=e171]: code
            - text: received from the authorize step.
          - listitem [ref=e172]:
            - code [ref=e173]: https://wakatime.com/oauth/revoke
            - text: "- Make a server-side POST request here to invalidate a secret access token. Required data is"
            - code [ref=e174]: client_id
            - text: ","
            - code [ref=e175]: client_secret
            - text: ", and the"
            - code [ref=e176]: token
            - text: (access or refresh) to be invalidated.
        - paragraph [ref=e177]:
          - text: For information about using these endpoints, see
          - link "RFC6749 OAuth 2.0" [ref=e178] [cursor=pointer]:
            - /url: https://tools.ietf.org/html/rfc6749
            - text: RFC6749 OAuth 2.0
            - generic [ref=e179]: 
          - text: .
        - paragraph
        - heading "Using Access Token" [level=4] [ref=e180]
        - paragraph
        - paragraph [ref=e181]:
          - text: After getting the bearer (access) token from
          - code [ref=e182]: https://wakatime.com/oauth/token
          - text: ", you can now make authenticated api calls using the Authorization request header ("
          - link "RFC 6750" [ref=e183] [cursor=pointer]:
            - /url: https://tools.ietf.org/html/rfc6750#section-2.1
            - text: RFC 6750
            - generic [ref=e184]: 
          - text: ).
        - paragraph [ref=e185]:
          - text: For example, if your user's access token is
          - code [ref=e186]: waka_tok_12345
          - text: ", you would add this header to your request:"
          - code [ref=e187]: "Authorization: Bearer waka_tok_12345"
          - text: .
        - paragraph [ref=e188]:
          - text: Alternatively, you can authenticate with url args named
          - code [ref=e189]: access_token
          - text: ", or just"
          - code [ref=e190]: token
          - text: and
          - code [ref=e191]: app_secret
          - text: ","
          - code [ref=e192]: client_secret
          - text: ", or just"
          - code [ref=e193]: secret
          - text: .
        - paragraph
        - heading "Using the Refresh Token" [level=4] [ref=e194]
        - paragraph
        - paragraph [ref=e195]:
          - text: You should always get a
          - code [ref=e196]: refresh_token
          - text: from the
          - code [ref=e197]: /oauth/token
          - text: response. The
          - code [ref=e198]: refresh_token
          - text: can be used when your
          - code [ref=e199]: access_token
          - text: has expired, to re-authorize without having to prompt the user.
        - paragraph [ref=e200]:
          - text: To use the
          - code [ref=e201]: refresh_token
          - text: ", make a POST request to"
          - code [ref=e202]: https://wakatime.com/oauth/token
          - text: to get a new secret access token. Required data is
          - code [ref=e203]: client_id
          - text: ","
          - code [ref=e204]: client_secret
          - text: ","
          - code [ref=e205]: redirect_uri
          - text: must be the same url used in authorize step,
          - code [ref=e206]: grant_type
          - text: of
          - code [ref=e207]: refresh_token
          - text: ", and the"
          - code [ref=e208]: refresh_token
          - text: received from a previous token response.
        - paragraph
        - heading "Revoking Tokens" [level=4] [ref=e209]
        - paragraph
        - paragraph [ref=e210]:
          - text: Your app should revoke tokens when users disconnect their WakaTime integration, delete their account on your app, or you no longer need access to a user’s account. To revoke an access token, and it’s corresponding refresh token, send a
          - code [ref=e211]: POST
          - text: request to
          - code [ref=e212]: /oauth/revoke
          - text: containing your app’s client_id, client_secret, and the token (access or refresh token) that you would like to revoke. Both JSON (
          - code [ref=e213]: "Content-Type: application/json"
          - text: ) and form-urlencoded (
          - code [ref=e214]: "Content-Type: application/x-www-form-urlencoded"
          - text: ) are supported as the POST body. The response status will be 200 success if the token is successfully disabled. If the token is already revoked or expired, this endpoint will still respond with a 200 success response.
        - paragraph [ref=e215]: "For example:"
        - paragraph [ref=e216]:
          - code [ref=e217]: "POST /oauth/revoke HTTP/1.1 Host: wakatime.com Content-Type: application/json {\"client_id\":\"XXX\",\"client_secret\":\"waka_sec_XXX\",\"token\":\"waka_tok_12345\"}"
        - paragraph [ref=e218]:
          - text: To revoke all tokens for a user, send
          - code [ref=e219]: user_id
          - text: along with your app’s
          - code [ref=e220]: client_id
          - text: and
          - code [ref=e221]: client_secret
          - text: ":"
        - paragraph [ref=e222]:
          - code [ref=e223]: "POST /oauth/revoke HTTP/1.1 Host: wakatime.com Content-Type: application/x-www-form-urlencoded client_id=XXX client_secret=waka_sec_XXX user_id=12345"
        - paragraph [ref=e224]:
          - text: Or, revoke all tokens for a user using a past access or refresh token for that user, with
          - code [ref=e225]: all=true
          - text: ":"
        - paragraph [ref=e226]:
          - code [ref=e227]: "POST /oauth/revoke HTTP/1.1 Host: wakatime.com Content-Type: application/x-www-form-urlencoded client_id=XXX client_secret=waka_sec_XXX all=true token=waka_tok_12345"
        - paragraph [ref=e228]: "Or, revoke all tokens for all users of your app:"
        - paragraph [ref=e229]:
          - code [ref=e230]: "POST /oauth/revoke HTTP/1.1 Host: wakatime.com Content-Type: application/x-www-form-urlencoded client_id=XXX client_secret=waka_sec_XXX all=true"
        - paragraph
        - heading "Scopes" [level=4] [ref=e231]
        - paragraph
        - paragraph [ref=e232]: Scopes are sent to the authorize url as a space or comma separated list, to request optional permissions for a user.
        - list [ref=e233]:
          - listitem [ref=e234]:
            - code [ref=e235]: read_summaries
            - text: "- access user’s"
            - link "Summaries" [ref=e236] [cursor=pointer]:
              - /url: "#summaries"
            - text: and
            - link "Stats" [ref=e237] [cursor=pointer]:
              - /url: "#stats"
            - text: "including categories, dependencies, editors, languages, machines, operating systems, and projects. Consider instead requesting scopes for only the summaries you need. For ex:"
            - code [ref=e238]: scope=read_summaries.languages,read_summaries.editors
            - text: to only request access to the user’s language and editor summaries and stats.
