          - text: "(Python):"
        - code [ref=e324]: "#!/usr/bin/env python import hashlib import os import sys from rauth import OAuth2Service if sys.version_info[0] == 3: raw_input = input print('Find your App Id at wakatime.com/apps') client_id = raw_input('Enter your App Id: ') client_secret = raw_input('Enter your App Secret: ') service = OAuth2Service( client_id=client_id, # your App ID from https://wakatime.com/apps client_secret=client_secret, # your App Secret from https://wakatime.com/apps name='wakatime', authorize_url='https://wakatime.com/oauth/authorize', access_token_url='https://wakatime.com/oauth/token', base_url='https://wakatime.com/api/v1/') redirect_uri = 'https://wakatime.com/oauth/test' state = hashlib.sha1(os.urandom(40)).hexdigest() params = {'scope': 'email,read_stats.languages', 'response_type': 'code', 'state': state, 'redirect_uri': redirect_uri} url = service.get_authorize_url(**params) print('**** Visit this url in your browser ****') print('*' * 80) print(url) print('*' * 80) print('**** After clicking Authorize, paste code here and press Enter ****') code = raw_input('Enter code from url: ') # Make sure returned state has not changed for security reasons, and exchange # code for an Access Token. headers = {'Accept': 'application/x-www-form-urlencoded'} print('Getting an access token...') session = service.get_auth_session(headers=headers, data={'code': code, 'grant_type': 'authorization_code', 'redirect_uri': redirect_uri}) print('Getting current user from API...') user = session.get('users/current').json() print('Authenticated via OAuth as {0}'.format(user['data']['email'])) print(\"Getting user's code stats from API...\") stats = session.get('users/current/stats') print(stats.text)"
        - paragraph [ref=e325]:
