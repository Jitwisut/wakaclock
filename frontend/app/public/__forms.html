<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AtoAxis forms</title>
  </head>
  <body>
    <!--
      Netlify scans static HTML during deploy to register form names and fields.
      The application submits to this file with JavaScript; visitors never need
      to see this document.
    -->
    <form data-netlify="true" data-netlify-honeypot="bot-field" hidden name="early-access">
      <input name="form-name" type="hidden" value="early-access" />
      <input name="locale" type="text" />
      <input name="source_page" type="text" />
      <input name="email" type="email" />
      <input name="interest" type="text" />
      <input name="consent" type="text" />
      <input name="bot-field" type="text" />
    </form>
  </body>
</html>
