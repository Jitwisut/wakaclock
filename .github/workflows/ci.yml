name: AtoAxis CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "features/**"
      - "phase3/**"
      - "phase4/**"
      - "phase7/**"
      - "fix/**"

permissions:
  contents: read

env:
  # Pinned so a new stable Rust cannot add clippy lints and turn CI red on its own.
  # Bump deliberately, together with any lint fixes.
  RUST_TOOLCHAIN: "1.96.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validate and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate typecheck, lint and unit tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run validate
      - name: Require complete frontend coverage
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run test:coverage
      - name: Build with production URL
        env:
          NEXT_PUBLIC_APP_URL: https://atoaxis.com
        run: npm run build
      - name: Verify generated routes and SEO artifacts
        run: npm run check:prerender

  frontend-e2e:
    name: Frontend browser smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: npm run test:e2e -- --project=chromium

  backend:
    name: Rust format, Clippy and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Install native Kafka build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake pkg-config libssl-dev libcurl4-openssl-dev libsasl2-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run unit and service tests
        run: cargo test --workspace
      - name: Compile Kafka adapter and fact-sink worker
        run: cargo check -p wakaclock-server --all-targets --features kafka
      - name: Run Phase 2 broker acceptance tests
        run: |
          cargo test -p wakaclock-core broker:: -- --test-threads=1
          cargo test -p wakaclock-cli broker:: -- --test-threads=1
          cargo test -p wakaclock-cli --test broker_process -- --test-threads=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git identity for the AI attribution integration checks
        run: |
          git config --global user.email "ci@wakaclock.test"
          git config --global user.name "Wakaclock CI"
      - name: Run AI attribution external-process integration checks
        working-directory: .
        run: python3 scripts/ai-attribution-integration.py

  backend-kafka:
    name: Rust Kafka/K5 strict gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Install native Kafka build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake pkg-config libssl-dev libcurl4-openssl-dev libsasl2-dev
      - name: Check workspace formatting
        run: cargo fmt --all -- --check
      - name: Check workspace with Kafka feature
        run: cargo check --workspace --features kafka
      - name: Run strict Kafka Clippy gate
        run: cargo clippy --workspace --all-targets --features kafka -- -D warnings
      - name: Run workspace tests with Kafka feature
        run: cargo test --workspace --features kafka

  k5-integration:
    name: K0/K5 isolated Kafka and RabbitMQ integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install native Kafka build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake pkg-config libssl-dev libcurl4-openssl-dev libsasl2-dev
      - name: Start isolated K5 infrastructure
        run: docker compose -p wakaclock-k5 -f docker-compose.kafka-spike.yml up -d --wait
      - name: Re-run the K0 11-scenario matrix
        run: make kafka-spike K0_COMPOSE_PROJECT=wakaclock-k5
      - name: Run the K5 fact, dedup, DLQ, relay and reconcile harness
        run: make k5-ai-usage-spike K5_COMPOSE_PROJECT=wakaclock-k5
      - name: Capture isolated broker logs
        if: always()
        run: docker compose -p wakaclock-k5 -f docker-compose.kafka-spike.yml logs --no-color > "${RUNNER_TEMP}/wakaclock-k5-compose.log"
      - name: Upload isolated broker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wakaclock-k5-compose-logs
          path: ${{ runner.temp }}/wakaclock-k5-compose.log
      - name: Tear down isolated K5 infrastructure
        if: always()
        run: docker compose -p wakaclock-k5 -f docker-compose.kafka-spike.yml down -v --remove-orphans

  duration-baseline:
    name: Phase 0 duration and attribution baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python port against Rust timeline semantics
        run: python3 scripts/duration-audit/verify_port.py
      - name: Replay metadata-only Golden Dataset
        run: python3 scripts/duration-audit/golden.py
      - name: Verify legacy boolean is compatibility-only
        run: python3 scripts/duration-audit/verify_actor_migration.py
      - name: Validate sanitized release certification
        run: python3 scripts/duration-audit/verify_certification.py

  ai-adapter-certification:
    name: AI adapter evidence privacy, integrity and current expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify historical integrity and current certificate freshness
        run: python3 scripts/ai-coverage/verify_inventory.py certifications/ai-adapters
      - name: Validate F4 certification artifacts and catalog
        run: |
          python3 -m unittest discover -s scripts/ai-coverage/tests -v
          python3 scripts/ai-coverage/validate_certification.py certifications/ai-adapters/historical
          python3 scripts/ai-coverage/validate_catalog.py certifications/ai-adapters/catalog-v1.json
      - name: Run F8 compatibility rehearsal (fail closed)
        shell: bash
        run: |
          report="$RUNNER_TEMP/f8-compatibility.json"
          set +e
          python3 scripts/ai-coverage/rehearse_compatibility.py --report "$report"
          code=$?
          set -e
          if [[ "$code" -ne 0 && "$code" -ne 2 ]]; then
            exit "$code"
          fi
          python3 - "$report" <<'PY'
          import json
          import sys
          report = json.loads(open(sys.argv[1], encoding="utf-8").read())
          if report.get("status") == "failed" or report.get("summary", {}).get("failed", 0):
              raise SystemExit("F8 compatibility rehearsal contains a failed case")
          print(json.dumps({"status": report.get("status"), "summary": report.get("summary")}, sort_keys=True))
          PY

  backend-integration:
    name: Rust ClickHouse integration tests
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.10
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      # The Team cost suite proxies ClickHouse and accepts only this dedicated instance.
      clickhouse-team-cost:
        image: clickhouse/clickhouse-server:24.10
        env:
          CLICKHOUSE_DB: wakaclock
          CLICKHOUSE_SKIP_USER_SETUP: 1
        ports:
          - 58125:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atoaxis
          POSTGRES_PASSWORD: atoaxis-test
          POSTGRES_DB: atoaxis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atoaxis -d atoaxis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend/api
    env:
      # Some financial transaction tests hold very large async futures; unoptimized test
      # builds overflow libtest's default 2 MiB thread stack.
      RUST_MIN_STACK: 8388608
      # Suites that refuse any PostgreSQL database except their own dedicated one. Each
      # entry is a test-path prefix and ends in `::` so one module cannot match another.
      # The shared run below skips all of them, so a new suite left out of every group
      # fails its own database guard there instead of silently not running.
      # scripts/ci-dedicated-db-tests.sh recreates the database before each suite.
      POSTGRES_TEST_BASE_URL: postgres://atoaxis:atoaxis-test@127.0.0.1:5432
      PGHOST: 127.0.0.1
      PGUSER: atoaxis
      PGPASSWORD: atoaxis-test
      TEAM_DB_TESTS: >-
        repository::copilot_daily::
        repository::copilot_reports_tests::
        repository::team_actions_tests::
        repository::team_cost_equations_tests::
        repository::team_financial_guard::
        repository::team_github_tests::
        repository::team_privacy_tests::
        repository::team_readiness_tests::
        repository::team_trust_tests::
        services::organizations::owner_security_tests::
      STRIPE_DB_TESTS: >-
        repository::team_analytics_entitlement::
        repository::team_financial_ingress::
        repository::team_financial_inventory::
        repository::team_financial_locks::
        repository::team_financial_recovery::
        repository::team_financial_transaction_tests::
        repository::team_stripe_tests::
        repository::team_subscription_cancellation::
        repository::team_trial::
        repository::team_usage_admissions::
        repository::user_identity_sync::
      # Also uses atoaxis_team_test, but against the dedicated ClickHouse service.
      TEAM_COST_DB_TESTS: "repository::team_cost_tests::"
      ONBOARDING_DB_TESTS: >-
        repository::team_organization_birth::
        repository::team_organization_recovery::
        repository::team_pilot::
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install PostgreSQL test client
        run: sudo apt-get install -y postgresql-client
      - name: Create the application ClickHouse database
        # Tests that build the full app state migrate into `wakaclock` and expect it to exist.
        run: curl -fsS http://127.0.0.1:8123/ --data-binary 'CREATE DATABASE IF NOT EXISTS wakaclock'
      - name: Run ignored database tests against isolated ClickHouse
        env:
          CLICKHOUSE_TEST_URL: http://127.0.0.1:8123
          CLICKHOUSE_TEST_USER: default
          CLICKHOUSE_TEST_PASSWORD: ""
          POSTGRES_TEST_URL: postgres://atoaxis:atoaxis-test@127.0.0.1:5432/atoaxis_test
          PRESENCE_TEST_POSTGRES_URL: postgres://atoaxis:atoaxis-test@127.0.0.1:5432/atoaxis_test
          RABBITMQ_TEST_URL: amqp://guest:guest@127.0.0.1:5672/%2f
        # The broker-restart test runs `docker restart` on a named container; CI's
        # service container cannot be restarted from inside the job, so it is skipped.
        # Suites with a dedicated database run in the steps below.
        run: |
          skips=()
          for prefix in $TEAM_DB_TESTS $TEAM_COST_DB_TESTS $STRIPE_DB_TESTS $ONBOARDING_DB_TESTS; do
            skips+=(--skip "$prefix")
          done
          cargo test -p wakaclock-server -- --ignored --test-threads=1 \
            --skip survive_a_broker_restart "${skips[@]}"
      - name: Build Team financial guard operator CLI for its database tests
        # Each suite below is independent: run every one even after a failure, so one
        # red suite cannot hide the state of the others.
        if: ${{ !cancelled() }}
        run: cargo build -p wakaclock-server --bin team-financial-guard
      - name: Run ignored Team and Copilot database tests
        if: ${{ !cancelled() }}
        env:
          CLICKHOUSE_TEST_URL: http://127.0.0.1:8123
          CLICKHOUSE_TEST_USER: default
          CLICKHOUSE_TEST_PASSWORD: ""
          TEAM_FINANCIAL_GUARD_TEST_BIN: ${{ github.workspace }}/backend/api/target/debug/team-financial-guard
        # The restore drill needs TEAM_DRILL_STAGE and is driven by scripts/team-restore-drill.py.
        run: >-
          ../../scripts/ci-dedicated-db-tests.sh atoaxis_team_test "$TEAM_DB_TESTS"
          --skip restore_drill_fixture_stages
      - name: Run ignored Team cost tests against the dedicated ClickHouse
        if: ${{ !cancelled() }}
        env:
          CLICKHOUSE_TEST_URL: http://127.0.0.1:58125
          CLICKHOUSE_TEST_DATABASE: wakaclock
        run: ../../scripts/ci-dedicated-db-tests.sh atoaxis_team_test "$TEAM_COST_DB_TESTS"
      - name: Run ignored Stripe and billing database tests
        if: ${{ !cancelled() }}
        env:
          CLICKHOUSE_TEST_URL: http://127.0.0.1:8123
          CLICKHOUSE_TEST_USER: default
          CLICKHOUSE_TEST_PASSWORD: ""
          TEAM_FINANCIAL_GUARD_TEST_BIN: ${{ github.workspace }}/backend/api/target/debug/team-financial-guard
          # Synthetic fixture paths only; the inventory test creates its ledger directory.
          STRIPE_TEST_CREDENTIALS_PATH: ${{ runner.temp }}/stripe-test-credentials.encrypted
          TEAM_FINANCIAL_INVENTORY_TEST_DIR: ${{ runner.temp }}/team-financial-inventory/ledger
        run: >-
          mkdir -p "$RUNNER_TEMP/team-financial-inventory" &&
          ../../scripts/ci-dedicated-db-tests.sh atoaxis_stripe_test "$STRIPE_DB_TESTS"
      - name: Run ignored Team onboarding database tests
        if: ${{ !cancelled() }}
        env:
          CLICKHOUSE_TEST_URL: http://127.0.0.1:8123
          CLICKHOUSE_TEST_USER: default
          CLICKHOUSE_TEST_PASSWORD: ""
        run: ../../scripts/ci-dedicated-db-tests.sh atoaxis_team_onboarding_test "$ONBOARDING_DB_TESTS"
      - name: Run collector process and offline lifecycle tests
        if: ${{ !cancelled() }}
        run: cargo test -p wakaclock-cli --tests -- --test-threads=1
      - name: Build API for cross-replica security regression tests
        if: ${{ !cancelled() }}
        run: cargo build -p wakaclock-server --bin wakaclock-server
      - name: Run cross-replica security and import smoke tests
        if: ${{ !cancelled() }}
        run: >-
          python3 ../../scripts/backend-security-smoke-runtime.py
          --binary target/debug/wakaclock-server
          --clickhouse-test-url http://127.0.0.1:8123
          --postgres-test-url postgres://atoaxis:atoaxis-test@127.0.0.1:5432/atoaxis_test

  extensions:
    name: Extension compile, tests and package checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit extension build dependencies
        run: npm audit --audit-level=high
      - name: Compile extension
        run: npm run compile
      - name: Run extension tests
        run: npm test
      - name: Verify resource packaging without native binaries
        run: npm run vscode:prepublish
      - name: Verify package metadata
        run: npm pack --dry-run

  phase3-extensions:
    name: Phase 3 Zed, Figma and Blender gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extensions/figma/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Zed extension launcher
        run: cargo test --manifest-path extensions/zed/Cargo.toml --locked
      - name: Compile Zed extension to WASM
        run: cargo check --manifest-path extensions/zed/Cargo.toml --target wasm32-wasip2 --locked
      - name: Build and process-smoke wakaclock-ls
        working-directory: backend/api
        run: cargo build -p wakaclock-ls
      - name: Verify LSP heartbeat transport against fake API
        run: python3 scripts/phase3-lsp-smoke.py
      - name: Install Figma dependencies
        working-directory: extensions/figma
        run: npm ci
      - name: Validate Figma plugin
        working-directory: extensions/figma
        run: npm run validate
      - name: Test Blender addon pure contract
        working-directory: extensions/blender
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v
      - name: Compile Blender addon Python
        working-directory: extensions/blender
        run: python3 -m compileall -q atoaxis

  contracts-and-security:
    name: Compatibility, secrets and dependency gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - name: Validate WakaTime compatibility manifest
        run: node scripts/verify-compatibility-manifest.mjs
      - name: Scan tracked files for private keys and API key literals
        shell: bash
        run: |
          if git grep -nE 'BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY|sk-[A-Za-z0-9]{20,}' -- ':!*.lock'; then
            echo "Potential credential material found in tracked files" >&2
            exit 1
          fi
      - name: Audit frontend dependencies
        working-directory: frontend/app
        run: |
          npm ci
          # Production dependencies: block high/critical advisories.
          npm audit --omit=dev --audit-level=high
          # Tooling dependencies: still block every critical advisory; some current
          # Storybook-only high advisories have no upstream fix yet.
          npm audit --audit-level=critical
