name: Release AtoAxis extensions

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-x64
            runner: macos-13
            rust_target: x86_64-apple-darwin
          - target: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
          - target: win32-x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
          - target: win32-arm64
            runner: windows-2022
            rust_target: aarch64-pc-windows-msvc
          - target: linux-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-musl
          - target: alpine-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-musl
          - target: linux-arm64
            runner: ubuntu-22.04
            rust_target: aarch64-unknown-linux-musl
          - target: alpine-arm64
            runner: ubuntu-22.04
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install musl/cross toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.rust_target }}
      - name: Build signed CLI
        shell: bash
        run: |
          manifest=Cargo.toml
          if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.rust_target }}" == aarch64-* ]]; then
            cargo install cross --git https://github.com/cross-rs/cross --locked
            cross build --manifest-path "$manifest" -p wakaclock-cli --release --target ${{ matrix.rust_target }}
          else
            cargo build --manifest-path "$manifest" -p wakaclock-cli --release --target ${{ matrix.rust_target }}
          fi
          test -f target/${{ matrix.rust_target }}/release/wakaclock${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "${MACOS_CERTIFICATE_BASE64:-}" || { echo "macOS signing certificate is required"; exit 1; }
          test -n "${MACOS_CERTIFICATE_PASSWORD:-}" || { echo "macOS signing certificate password is required"; exit 1; }
          certificate="$RUNNER_TEMP/atoaxis-signing.p12"
          keychain="$RUNNER_TEMP/atoaxis-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { throw 'Windows signing certificate is required' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'Windows signing certificate password is required' }
          $certificate = Join-Path $env:RUNNER_TEMP 'atoaxis-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $certificate -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $imported) { throw 'Windows signing certificate import failed' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($imported.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Package target VSIX
        working-directory: extensions/vscode
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Git tag and Extension version must match ($GITHUB_REF_NAME vs $version)"
            exit 1
          fi
          binary="../../backend/api/target/${{ matrix.rust_target }}/release/wakaclock"
          if [[ "${{ runner.os }}" == "Windows" ]]; then binary="${binary}.exe"; fi
          # Signing is deliberately a required precondition in production. The
          # secrets are configured only on the release environment, never in PRs.
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            test -n "${MACOS_SIGNING_IDENTITY:-}" || { echo "macOS Developer ID signing identity is required"; exit 1; }
            codesign --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$binary"
            test -n "${APPLE_ID:-}" -a -n "${APPLE_TEAM_ID:-}" -a -n "${APPLE_APP_PASSWORD:-}" || { echo "Apple notarization credentials are required"; exit 1; }
            ditto -c -k --keepParent "$binary" "/tmp/atoaxis-${{ matrix.target }}.zip"
            xcrun notarytool submit "/tmp/atoaxis-${{ matrix.target }}.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$binary" || true
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -n "${WINDOWS_CERTIFICATE_THUMBPRINT:-}" || { echo "Windows Authenticode certificate is required"; exit 1; }
            signtool sign /sha1 "$WINDOWS_CERTIFICATE_THUMBPRINT" /fd SHA256 "$binary"
          fi
          "$binary" --version
          smoke_home="$(mktemp -d)"
          HOME="$smoke_home" "$binary" verify --json || true
          npm run build:resources
          CLI_VERSION="$version" npm run package:target -- ${{ matrix.target }} "$binary"
          unzip -l atoaxis-vscode-*.vsix | grep -E "resources/(bin/wakaclock(\\.exe)?|ai-agents/bundle-manifest.json|cli-manifest.json)"
      - name: Package terminal archive with verified AI resources
        if: runner.os != 'Windows'
        working-directory: extensions/vscode
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "${{ matrix.target }}" in
            darwin-x64) archive_os=darwin; archive_arch=x86_64 ;;
            darwin-arm64) archive_os=darwin; archive_arch=arm64 ;;
            linux-x64|alpine-x64) archive_os=linux; archive_arch=x86_64 ;;
            linux-arm64|alpine-arm64) archive_os=linux; archive_arch=arm64 ;;
            *) echo "unsupported archive target" >&2; exit 1 ;;
          esac
          binary="../../backend/api/target/${{ matrix.rust_target }}/release/wakaclock"
          archive_root="$RUNNER_TEMP/wakaclock-archive"
          rm -rf "$archive_root"
          mkdir -p "$archive_root/resources"
          cp "$binary" "$archive_root/wakaclock"
          cp -R resources/ai-agents "$archive_root/resources/ai-agents"
          test -f "$archive_root/resources/ai-agents/bundle-manifest.json"
          archive="wakaclock-${version}-${archive_os}-${archive_arch}.tar.gz"
          tar -czf "$archive" -C "$archive_root" wakaclock resources/ai-agents
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: atoaxis-vscode-${{ matrix.target }}
          path: |
            extensions/vscode/*.vsix
            extensions/vscode/wakaclock-*.tar.gz*

  zed-language-server:
    name: Package Zed language server ${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: darwin-x64
            runner: macos-13
            rust_target: x86_64-apple-darwin
          - asset: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
          - asset: windows-x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
          - asset: windows-arm64
            runner: windows-2022
            rust_target: aarch64-pc-windows-msvc
          - asset: linux-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-musl
          - asset: linux-arm64
            runner: ubuntu-22.04
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux cross toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.rust_target }}
      - name: Build language server
        shell: bash
        run: |
          manifest=backend/api/Cargo.toml
          if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.rust_target }}" == aarch64-* ]]; then
            cargo install cross --git https://github.com/cross-rs/cross --locked
            cross build --manifest-path "$manifest" -p wakaclock-ls --release --target ${{ matrix.rust_target }}
          else
            cargo build --manifest-path "$manifest" -p wakaclock-ls --release --target ${{ matrix.rust_target }}
          fi
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "${MACOS_CERTIFICATE_BASE64:-}" || { echo "macOS signing certificate is required"; exit 1; }
          test -n "${MACOS_CERTIFICATE_PASSWORD:-}" || { echo "macOS signing certificate password is required"; exit 1; }
          certificate="$RUNNER_TEMP/atoaxis-signing.p12"
          keychain="$RUNNER_TEMP/atoaxis-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { throw 'Windows signing certificate is required' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'Windows signing certificate password is required' }
          $certificate = Join-Path $env:RUNNER_TEMP 'atoaxis-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $certificate -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $imported) { throw 'Windows signing certificate import failed' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($imported.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Sign, verify and create checksum
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          binary="backend/api/target/${{ matrix.rust_target }}/release/wakaclock-ls"
          extension=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary="${binary}.exe"
            extension=".exe"
          fi
          test -f "$binary"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            test -n "${MACOS_SIGNING_IDENTITY:-}" || { echo "macOS signing identity is required"; exit 1; }
            codesign --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$binary"
            test -n "${APPLE_ID:-}" -a -n "${APPLE_TEAM_ID:-}" -a -n "${APPLE_APP_PASSWORD:-}" || { echo "Apple notarization credentials are required"; exit 1; }
            ditto -c -k --keepParent "$binary" "/tmp/atoaxis-ls-${{ matrix.asset }}.zip"
            xcrun notarytool submit "/tmp/atoaxis-ls-${{ matrix.asset }}.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -n "${WINDOWS_CERTIFICATE_THUMBPRINT:-}" || { echo "Windows Authenticode certificate is required"; exit 1; }
            signtool sign /sha1 "$WINDOWS_CERTIFICATE_THUMBPRINT" /fd SHA256 "$binary"
          fi
          mkdir -p release-assets
          asset="release-assets/wakaclock-ls-${{ matrix.asset }}${extension}"
          cp "$binary" "$asset"
          python -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); digest=hashlib.sha256(p.read_bytes()).hexdigest(); p.with_name(p.name+".sha256").write_text(f"{digest}  {p.name}\n")' "$asset"
      - uses: actions/upload-artifact@v4
        with:
          name: atoaxis-zed-ls-${{ matrix.asset }}
          path: release-assets/*

  publish-language-server:
    needs: zed-language-server
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: atoaxis-zed-ls-*
          merge-multiple: true
      - name: Verify release asset set
        run: |
          test "$(find dist -maxdepth 1 -type f ! -name '*.sha256' | wc -l)" -eq 6
          test "$(find dist -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 6
          for checksum in dist/*.sha256; do
            (cd dist && sha256sum -c "$(basename "$checksum")")
          done
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "AtoAxis $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi

  publish:
    needs: [package, publish-language-server]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: atoaxis-vscode-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: test "$(find dist -name '*.vsix' | wc -l)" -eq 8
      - run: test "$(find dist -name 'wakaclock-*.tar.gz' | wc -l)" -eq 6
      - name: Verify terminal archive checksums and resources
        run: |
          for checksum in dist/wakaclock-*.tar.gz.sha256; do
            (cd dist && sha256sum -c "$(basename "$checksum")")
          done
          for archive in dist/wakaclock-*.tar.gz; do
            tar -tzf "$archive" | grep -q 'resources/ai-agents/bundle-manifest.json'
          done
      - name: Publish every platform package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for package in dist/*.vsix; do
            npx --yes @vscode/vsce publish --packagePath "$package" --pat "${{ secrets.VSCE_PAT }}"
          done
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/wakaclock-*.tar.gz dist/wakaclock-*.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/wakaclock-*.tar.gz dist/wakaclock-*.tar.gz.sha256 --verify-tag --generate-notes --title "AtoAxis $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
